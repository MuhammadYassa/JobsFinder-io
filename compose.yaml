services:
  jobsfinder:
    build: .
    image: jobsfinder-io:local
    # Set these to your host UID/GID on Linux if they differ from 1000.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_PRELIMINARY_MODEL: ${GEMINI_PRELIMINARY_MODEL:-gemini-3.5-flash-lite}
      GEMINI_REVIEW_MODEL: ${GEMINI_REVIEW_MODEL:-gemini-3.5-flash-lite}
      GEMINI_MAX_CALLS: ${GEMINI_MAX_CALLS:-0}
      GEMINI_BATCH_ENABLED: ${GEMINI_BATCH_ENABLED:-false}
      GEMINI_BATCH_MODEL: ${GEMINI_BATCH_MODEL:-gemini-3.5-flash-lite}
      GEMINI_BATCH_SIZE: ${GEMINI_BATCH_SIZE:-10}
      GEMINI_BATCH_INPUT_TOKENS: ${GEMINI_BATCH_INPUT_TOKENS:-24000}
      GEMINI_BATCH_OUTPUT_TOKENS: ${GEMINI_BATCH_OUTPUT_TOKENS:-24576}
      GEMINI_BATCH_JOB_OUTPUT_TOKENS: ${GEMINI_BATCH_JOB_OUTPUT_TOKENS:-1600}
      GEMINI_TOKEN_COUNT_MODE: ${GEMINI_TOKEN_COUNT_MODE:-near_limit}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-500}
      GEMINI_RETRY_RESERVE: ${GEMINI_RETRY_RESERVE:-2}
      GEMINI_RPM: ${GEMINI_RPM:-15}
      GEMINI_TPM: ${GEMINI_TPM:-250000}
      GEMINI_SESSION_BATCHES: ${GEMINI_SESSION_BATCHES:-8}
      JOBSFINDER_PROFILE: ${JOBSFINDER_PROFILE:-}
      JOBSFINDER_CANDIDATES: ${JOBSFINDER_CANDIDATES:-}
      JOBSFINDER_REPORT_DIR: ${JOBSFINDER_REPORT_DIR:-/app/data/reports}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      - type: bind
        source: ${JOBSFINDER_DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: false
