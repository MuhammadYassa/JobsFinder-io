name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --locked --no-sync ruff check .

      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check .

      - name: Run all tests, including migrations and mocked HTTP
        run: uv run --locked --no-sync pytest

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker compose build

      - name: Check container migrations, CLI, and SQLite persistence
        shell: bash
        run: |
          LOCAL_UID="$(id -u)"
          LOCAL_GID="$(id -g)"
          JOBSFINDER_DATA_DIR="$(mktemp -d)"
          export LOCAL_UID LOCAL_GID JOBSFINDER_DATA_DIR
          docker compose run --rm jobsfinder python -c 'import os; assert os.getuid() != 0'
          docker compose run --rm jobsfinder alembic upgrade head
          docker compose run --rm jobsfinder jobsfinder-io add-employer --name "CI Example"
          docker compose run --rm jobsfinder jobsfinder-io add-source --employer-id 1 --provider greenhouse --board-identifier ci-example --careers-url https://example.com/careers
          docker compose run --rm jobsfinder jobsfinder-io list-sources | grep -F ci-example
          docker compose run --rm jobsfinder alembic upgrade head
          docker compose run --rm jobsfinder alembic check
          docker compose run --rm jobsfinder python -c 'import sqlite3; db = sqlite3.connect("data/jobsfinder.db"); tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type = ?", ("table",))}; assert tables == {"employers", "job_sources", "postings", "poll_runs", "alembic_version"}'
