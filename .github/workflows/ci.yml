name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --locked --no-sync ruff check .

      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check .

      - name: Run all tests, including migrations and mocked HTTP
        run: uv run --locked --no-sync pytest

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          uv run --locked --no-sync python deploy/verify_config.py

      - name: Validate production systemd units
        run: systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer

      - name: Build Docker image
        run: docker compose build

      - name: Check container migrations, CLI, and SQLite persistence
        shell: bash
        run: |
          LOCAL_UID="$(id -u)"
          LOCAL_GID="$(id -g)"
          JOBSFINDER_DATA_DIR="$(mktemp -d)"
          export LOCAL_UID LOCAL_GID JOBSFINDER_DATA_DIR
          docker compose run --rm jobsfinder python -c 'import os; assert os.getuid() != 0'
          docker compose run --rm jobsfinder alembic upgrade head
          docker compose run --rm jobsfinder jobsfinder-io add-employer --name "CI Example"
          docker compose run --rm jobsfinder jobsfinder-io add-source --employer-id 1 --provider greenhouse --board-identifier ci-example --careers-url https://example.com/careers
          docker compose run --rm jobsfinder jobsfinder-io list-sources | grep -F ci-example
          docker compose run --rm jobsfinder alembic upgrade head
          docker compose run --rm jobsfinder alembic check
          docker compose run --rm jobsfinder python -c 'import sqlite3; db = sqlite3.connect("data/jobsfinder.db"); tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type = ?", ("table",))}; assert tables == {"employers", "job_sources", "postings", "poll_runs", "screening_results", "deliveries", "discovery_attempts", "task_runs", "alembic_version"}'
          docker compose run --rm jobsfinder jobsfinder-io health
          docker compose run --rm jobsfinder jobsfinder-io run-due
          docker run --rm -i --network none --read-only --memory 512m --memory-swap 512m \
            --tmpfs /tmp:size=32m,mode=1777 \
            --mount "type=bind,source=$PWD/deploy,target=/verification,readonly" \
            jobsfinder-io:local python - < deploy/linux_smoke.py

  publish-production:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: jobsfinder-production-publish
      cancel-in-progress: false
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GHCR using the job token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build or reuse immutable SHA image and verify it offline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="$IMAGE:sha-$GITHUB_SHA"
          INSPECT_ERROR="$(mktemp)"
          if docker manifest inspect "$TAG" >/dev/null 2>"$INSPECT_ERROR"; then
            docker pull --platform linux/amd64 "$TAG"
          else
            # A transient lookup/auth failure must never overwrite an existing tag.
            if ! grep -Eqi 'manifest unknown|no such manifest|MANIFEST_UNKNOWN|name unknown' "$INSPECT_ERROR"; then
              # GHCR may deny manifest access before the package's first publish.
              # Only an authenticated package-metadata 404 permits that bootstrap.
              OWNER_TYPE="$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)"
              PREFIX=users
              if [ "$OWNER_TYPE" = Organization ]; then PREFIX=orgs; fi
              PACKAGE="${GITHUB_REPOSITORY#*/}"
              PACKAGE_ERROR="$(mktemp)"
              if gh api "$PREFIX/$GITHUB_REPOSITORY_OWNER/packages/container/${PACKAGE,,}" >/dev/null 2>"$PACKAGE_ERROR"; then
                echo "Package exists but manifest lookup failed; refusing to overwrite."
                exit 1
              elif ! grep -Fq '(HTTP 404)' "$PACKAGE_ERROR"; then
                echo "Cannot establish package absence; check registry permissions."
                exit 1
              fi
            fi
            docker build --platform linux/amd64 \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$TAG" .
          fi
          test "$(docker image inspect "$TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker run --rm -i --network none "$TAG" python - < deploy/image_smoke.py
          docker push "$TAG"

      - name: Promote only the tested current main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "Superseded main commit; immutable image retained without promotion."
            exit 0
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:production"
          docker push "$IMAGE:production"
